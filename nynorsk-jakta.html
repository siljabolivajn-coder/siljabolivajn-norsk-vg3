<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Silja Nordvik">
<title>Nynorsk-jakta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f23; --panel:#1b1b3a; --edge:#f8f8f8; --ink:#f8f8f8;
    --gold:#fcd34d; --green:#5ee36a; --red:#ff5a5a; --blue:#5ac8ff; --dim:#9aa0c8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"VT323",ui-monospace,monospace;font-size:22px;line-height:1.15;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
  h1,h2,.px{font-family:"Press Start 2P",ui-monospace,monospace;font-weight:normal;letter-spacing:.5px}
  .wrap{width:100%;max-width:960px}
  header.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  header.top h1{font-size:14px;margin:0;color:var(--gold);text-shadow:2px 2px 0 #b4400c}
  .btn{font-family:"Press Start 2P",monospace;font-size:11px;background:var(--panel);color:var(--ink);
       border:3px solid var(--edge);box-shadow:4px 4px 0 #000;padding:10px 14px;cursor:pointer;
       text-transform:uppercase}
  .btn:hover{background:#2a2a5a}
  .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
  .btn.go{background:#1f7a2c}
  .btn.go:hover{background:#26963a}
  .btn.small{font-size:9px;padding:7px 9px}
  .stage{position:relative;width:100%;aspect-ratio:320/200;border:4px solid var(--edge);
         box-shadow:6px 6px 0 #000;background:#000;touch-action:none;user-select:none}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:rgba(10,10,30,.88);padding:14px;overflow:auto}
  .overlay[hidden]{display:none}
  .card{max-width:620px;width:100%;text-align:center}
  .card h2{font-size:clamp(14px,2.6vw,22px);color:var(--gold);margin:0 0 14px;text-shadow:3px 3px 0 #b4400c;line-height:1.4}
  .card p{margin:8px 0;font-size:clamp(18px,2.6vw,24px)}
  .tip{border:3px dashed var(--blue);padding:10px 12px;margin:12px 0;text-align:left;color:#dff4ff}
  .tip b{color:var(--blue);font-family:"Press Start 2P",monospace;font-size:10px;display:block;margin-bottom:6px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:20px}
  .ok{color:var(--green)} .bad{color:var(--red)} .gold{color:var(--gold)} .dim{color:var(--dim)}
  .status{min-height:32px;margin:12px 0 6px;font-size:24px;text-align:center}
  .controls{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
  .controls .btn{flex:1;font-size:18px;padding:14px 0}
  .review{columns:2;column-gap:20px;text-align:left;margin:10px auto 0;max-width:460px;font-size:21px}
  .review div{break-inside:avoid}
  .levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
  .levels .btn{font-size:8px;line-height:1.6;padding:8px}
  footer{margin-top:14px;font-size:20px;color:var(--dim);text-align:center}
  footer b{color:var(--gold);font-weight:normal}
  @media (hover:hover) and (pointer:fine){ .controls{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>NYNORSK-JAKTA</h1>
    <div style="display:flex;gap:8px">
      <button class="btn small" id="pauseBtn" title="Pause (P)">Pause</button>
      <button class="btn small" id="soundBtn" title="Lyd av/på">Lyd: på</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" width="320" height="200"></canvas>

    <div class="overlay" id="ov">
      <div class="card" id="ovCard"></div>
    </div>
  </div>

  <div class="status" id="status">&nbsp;</div>

  <div class="controls">
    <button class="btn" id="leftBtn" aria-label="Venstre">◀</button>
    <button class="btn" id="rightBtn" aria-label="Høgre">▶</button>
  </div>

  <footer>Laga av <b>Silja Nordvik</b> · Basert på «Nynorsk – det viktigaste å passe på»</footer>
</div>

<script>
/* Nynorsk-jakta – laga av Silja Nordvik */
(() => {
"use strict";

// ---------- Innhald: eitt brett per del av oversikta ----------
const LEVELS = [
  { name:"Småorda", hint:"Dei vanlegaste orda i nynorsk.",
    tip:"Småorda kjem i nesten kvar setning: eg, ikkje, kva, kjem, gjer, berre, mykje. Og hugs: -leg, ikkje -lig (tydeleg, mogleg).",
    pairs:[["eg","jeg"],["ikkje","ikke"],["kva","hva"],["kven","hvem"],["korleis","hvordan"],["kvifor","hvorfor"],
           ["vere","være"],["har vore","har vært"],["kjem","kommer"],["gjer","gjør"],["seier","sier"],["fekk","fikk"],
           ["blei","ble"],["noko","noe"],["mykje","mye"],["berre","bare"],["viss","hvis"],["desse","disse"],
           ["framleis","fortsatt"],["veg","vei"],["Noreg","Norge"],["tydeleg","tydelig"]] },
  { name:"Substantiv", hint:"Tre kjønn og nye endingar i fleirtal.",
    tip:"Hankjønn: gutar – gutane. Hokjønn: jenter – jentene, og ord på -ing er hokjønn. Inkjekjønn har inga ending i ubestemt fleirtal: fleire møte, mange eksempel.",
    pairs:[["gutar","gutter"],["gutane","guttene"],["husa","husene"],["fleire møte","flere møter"],["mange eksempel","mange eksempler"],
           ["ei stemning","en stemning"],["stemningar","stemninger"],["verkemiddel","virkemidler"],["boka","boken"],
           ["ei bok","en bok"],["lærarar","lærere"],["bilane","bilene"]] },
  { name:"Verb", hint:"A-verb, sterke verb og st-verb.",
    tip:"Kan verbet ha -a/-et i preteritum på bokmål? Då er det eit a-verb: kastar – kasta. Sterke verb: skriv – skreiv – har skrive. St-verb sluttar på -st: finst, synest.",
    pairs:[["kastar","kaster"],["kasta","kastet"],["dansar","danser"],["dansa","danset"],["har skrive","har skrevet"],
           ["skreiv","skrev"],["braut","brøt"],["har lese","har lest"],["finst","finnes"],["synest","synes"],
           ["møtest","møtes"],["har vore","har vært"],["Boka er skriven","Boka er skrevet"]] },
  { name:"Adjektiv", hint:"-leg, -are/-ast og bestemmarord.",
    tip:"Skriv -leg og -are/-ast: triveleg, finare, finast. Bestemmarorda bøyer seg: ein annan gut, ei anna jente, inga jakke, ikkje noko hus.",
    pairs:[["triveleg","trivelig"],["mogleg","mulig"],["finare","finere"],["finast","finest"],["ei anna jente","ei annen jente"],
           ["eit anna tre","et annet tre"],["inga jakke","ingen jakke"],["inga løysing","ingen løysing"],["noka jakke","noen jakke"],
           ["ein annan gut","en annen gutt"]] },
  { name:"Pronomen", hint:"Eg, ho, dei – og ein for man.",
    tip:"Eg, ho, hennar, dei, deira. Vel anten de – dykk – dykkar eller dokker – dokker – dokkar, og hald deg til det. Bruk ein der bokmål har man.",
    pairs:[["eg","jeg"],["ho","hun"],["hennar","hennes"],["deira","deres"],["dykk","dere"],["ein","man"],
           ["noko","noe"],["nokon","noen"]] },
  { name:"Setningar", soft:true, hint:"Eigedomsord, dobbel bestemming, passiv, genitiv.",
    tip:"Eigedomsordet står etter (huset vårt), dobbel bestemming (denne saka), passiv med blir (blir vist) og helst ingen s-genitiv (kaka til Petter).",
    pairs:[["far min","min far"],["huset vårt","vårt hus"],["denne saka","denne sak"],["den norske kulturen","den norske kultur"],
           ["blir vist","vises"],["kan hentast","kan hentes"],["kaka til Petter","Petters kake"],["skulekantina","skolens kantine"],
           ["går fram","fremgår"],["kjende att","gjenkjente"],["gir ut","utgir"]] },
  { name:"An-be-het-else", soft:true, hint:"Vel norske alternativ.",
    tip:"An-be-het-else-ord er lov, men vel norske alternativ når du kan: tilrå, tyding, moglegheit, merksemd, forståing, samanheng.",
    pairs:[["tilrå","anbefale"],["aning","anelse"],["bruke","anvende"],["folk","befolkning"],["hending","begivenhet"],
           ["tyding","betydning"],["moglegheit","mulighet"],["merksemd","oppmerksomhet"],["forståing","forståelse"],["samanheng","forbindelse"]] },
];
const GOAL = 8;       // ord som må fangast per brett
const LIVES = 3;

// ---------- Oppsett ----------
const W = 320, H = 200, GROUND = 184;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const ov = document.getElementById("ov"), ovCard = document.getElementById("ovCard");
const statusEl = document.getElementById("status");
const FONT = '8px "Press Start 2P", monospace';

let store = null; try { store = window.localStorage; } catch(e) {}
const getBest = () => { try { return +(store && store.getItem("nnjakta_best")) || 0; } catch(e){ return 0; } };
const setBest = v => { try { store && store.setItem("nnjakta_best", String(v)); } catch(e){} };

// ---------- Lyd ----------
let actx = null, soundOn = true;
function beep(freq, dur=0.08, type="square", vol=0.05, slide=0){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.linearRampToValueAtTime(freq+slide,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const sfx = {
  good(){ beep(880,.06); setTimeout(()=>beep(1320,.08),60); },
  bad(){ beep(180,.25,"sawtooth",.06,-90); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*110)); },
  over(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle",.07),i*160)); },
  start(){ beep(660,.06); setTimeout(()=>beep(990,.06),70); }
};

// ---------- Sprite ----------
const PAL = { R:"#e83b3b", S:"#ffcc99", K:"#1b1b1b", B:"#3b6fe8", Y:"#c9822b", W:"#f5d27a", L:"#2c2c6e", D:"#5a3a1a", H:"#ffe08a" };
const SPRITE = [
  "......RRRR......",
  ".....RRRRRR.....",
  "....RRRRRRRRRR..",
  ".....SSSSSS.....",
  ".....SKSSKS.....",
  ".....SSSSSS.....",
  "......SKKS......",
  "....BBBBBBBB....",
  "...SBBBBBBBBS...",
  "..SSBBBBBBBBSS..",
  "YYYYYYYYYYYYYYYY",
  ".YWYWYWYWYWYWYW.",
  "..YYYYYYYYYYYY..",
  "....LL....LL....",
  "....LL....LL....",
  "...DDD....DDD...",
];
const SCALE = 2, PW = 16*SCALE, PH = 16*SCALE;
function drawSprite(x,y,flash){
  for(let r=0;r<SPRITE.length;r++) for(let c=0;c<16;c++){
    const ch = SPRITE[r][c]; if(ch===".") continue;
    ctx.fillStyle = flash ? "#ffffff" : PAL[ch];
    ctx.fillRect(Math.round(x)+c*SCALE, Math.round(y)+r*SCALE, SCALE, SCALE);
  }
}
const HEART = [".HH.HH.","HHHHHHH","HHHHHHH",".HHHHH.","..HHH..","...H..."];
function drawHeart(x,y,full){
  for(let r=0;r<HEART.length;r++) for(let c=0;c<7;c++){
    if(HEART[r][c]!=="H") continue;
    ctx.fillStyle = full ? "#ff4d6d" : "#44445e"; ctx.fillRect(x+c,y+r,1,1);
  }
}

// ---------- Bakgrunn ----------
const stars = Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*150,s:Math.random()<.2?2:1,t:Math.random()*6}));
function drawBg(dt){
  ctx.fillStyle="#0f0f23"; ctx.fillRect(0,0,W,H);
  for(const s of stars){ s.t+=dt; ctx.fillStyle = (Math.sin(s.t*2)>-.3) ? "#c9d1ff" : "#4a4f7a"; ctx.fillRect(s.x|0,s.y|0,s.s,s.s); }
  // fjell
  ctx.fillStyle="#232350";
  for(let x=0;x<W;x+=2){ const h = 22+Math.sin(x*0.045)*10+Math.sin(x*0.13)*4; ctx.fillRect(x,GROUND-h,2,h); }
  ctx.fillStyle="#2f2f66";
  for(let x=0;x<W;x+=2){ const h = 10+Math.sin(x*0.07+1)*6; ctx.fillRect(x,GROUND-h,2,h); }
  // bakke
  ctx.fillStyle="#3aa04a"; ctx.fillRect(0,GROUND,W,4);
  ctx.fillStyle="#6b3f1f"; ctx.fillRect(0,GROUND+4,W,H-GROUND-4);
  ctx.fillStyle="#57321a"; for(let x=0;x<W;x+=8) ctx.fillRect(x+((x/8)%2?3:0),GROUND+8,3,2);
}

// ---------- Spelstatus ----------
let state = "title";   // title | intro | play | paused | clear | over | win
let lvl = 0, score = 0, lives = LIVES, caught = 0;
let px = W/2-PW/2, words = [], particles = [], spawnT = 0, flashT = 0, shakeT = 0;
let mistakes = new Map();   // bokmål -> nynorsk
const keys = {left:false,right:false};
let targetX = null;

function speedFor(l){ return 22 + l*5; }
function spawnEvery(l){ return Math.max(0.95, 1.7 - l*0.11); }

function textW(t){ ctx.font = FONT; return Math.ceil(ctx.measureText(t).width); }

function spawnWord(){
  const L = LEVELS[lvl];
  const pair = L.pairs[(Math.random()*L.pairs.length)|0];
  const good = Math.random() < 0.55;
  const text = good ? pair[0] : pair[1];
  const w = textW(text) + 8, h = 14;
  let x, tries = 0;
  do { x = 4 + Math.random()*(W - w - 8); tries++; }
  while (tries < 12 && words.some(o => o.y < 30 && x < o.x+o.w+6 && x+w+6 > o.x));
  words.push({ text, good, pair, x, y:-h, w, h, v: speedFor(lvl)*(0.85+Math.random()*0.3) });
}

function burst(x,y,color){
  for(let i=0;i<14;i++) particles.push({x,y,vx:(Math.random()-.5)*90,vy:-Math.random()*90-20,t:.6,color});
}

function say(html){ statusEl.innerHTML = html || "&nbsp;"; }

function update(dt){
  if(state!=="play") return;
  // flytt spelar
  const sp = 170;
  if(keys.left) px -= sp*dt;
  if(keys.right) px += sp*dt;
  if(targetX!==null && !keys.left && !keys.right){
    const d = targetX - (px+PW/2);
    if(Math.abs(d)>1) px += Math.sign(d)*Math.min(Math.abs(d), sp*1.3*dt);
  }
  px = Math.max(0, Math.min(W-PW, px));

  spawnT -= dt;
  if(spawnT<=0){ spawnWord(); spawnT = spawnEvery(lvl)*(0.8+Math.random()*0.4); }

  const basketY = GROUND - PH + 20; // korgkanten
  for(let i=words.length-1;i>=0;i--){
    const o = words[i];
    o.y += o.v*dt;
    const hit = o.y + o.h >= basketY && o.y + o.h <= basketY + 10 &&
                o.x < px + PW - 2 && o.x + o.w > px + 2;
    if(hit){
      words.splice(i,1);
      if(o.good){
        caught++; score += 10 + lvl*2; sfx.good(); burst(o.x+o.w/2, basketY, "#5ee36a");
        say(`<span class="ok">Rett!</span> «${esc(o.text)}» er nynorsk.`);
        if(caught>=GOAL){ levelClear(); return; }
      } else {
        lives--; sfx.bad(); flashT = .35; shakeT = .3; burst(o.x+o.w/2, basketY, "#ff5a5a");
        mistakes.set(o.pair[1], o.pair[0]);
        say(LEVELS[lvl].soft
          ? `<span class="bad">Au!</span> På nynorsk skriv du helst <span class="ok">«${esc(o.pair[0])}»</span>, ikkje «${esc(o.pair[1])}».`
          : `<span class="bad">Au!</span> «${esc(o.pair[1])}» heiter <span class="ok">«${esc(o.pair[0])}»</span> på nynorsk.`);
        if(lives<=0){ gameOver(); return; }
      }
    } else if(o.y > GROUND){
      words.splice(i,1);
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.t -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt;
    if(p.t<=0) particles.splice(i,1);
  }
  flashT = Math.max(0, flashT-dt); shakeT = Math.max(0, shakeT-dt);
}

function render(dt){
  ctx.save();
  if(shakeT>0) ctx.translate(((Math.random()*4)|0)-2, ((Math.random()*4)|0)-2);
  drawBg(dt);
  ctx.font = FONT; ctx.textBaseline = "top";
  for(const o of words){
    const x = Math.round(o.x), y = Math.round(o.y);
    ctx.fillStyle="#000"; ctx.fillRect(x+2,y+2,o.w,o.h);
    ctx.fillStyle="#f4f4f4"; ctx.fillRect(x,y,o.w,o.h);
    ctx.fillStyle="#1b1b3a"; ctx.fillRect(x+1,y+1,o.w-2,o.h-2);
    ctx.fillStyle="#f8f8f8"; ctx.fillText(o.text, x+4, y+4);
  }
  if(state!=="title") drawSprite(px, GROUND-PH+2, flashT>0 && ((flashT*20)|0)%2===0);
  for(const p of particles){ ctx.fillStyle=p.color; ctx.fillRect(p.x|0,p.y|0,2,2); }
  ctx.restore();

  // HUD
  if(state!=="title"){
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,14);
    ctx.font = FONT; ctx.textBaseline="top";
    for(let i=0;i<LIVES;i++) drawHeart(4+i*9,4,i<lives);
    ctx.fillStyle="#fcd34d"; ctx.fillText(String(score).padStart(5,"0"), 36, 3);
    const lab = `BRETT ${lvl+1}`; ctx.fillStyle="#5ac8ff"; ctx.fillText(lab, 96, 3);
    // framdrift
    const bx = 176, bw = 140;
    ctx.fillStyle="#44445e"; ctx.fillRect(bx,4,bw,6);
    ctx.fillStyle="#5ee36a"; ctx.fillRect(bx,4,Math.round(bw*Math.min(1,caught/GOAL)),6);
  }
}

function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---------- Skjermar ----------
function show(html){ ovCard.innerHTML = html; ov.hidden = false; const b = ovCard.querySelector("[data-focus]"); if(b) b.focus(); }
function hide(){ ov.hidden = true; }

function titleScreen(){
  state="title"; words=[]; particles=[];
  const best = getBest();
  show(`
    <h2>NYNORSK-JAKTA</h2>
    <p>Fang orda som er rett på <span class="ok">nynorsk</span>.<br>Unngå <span class="bad">bokmålsformene</span> – dei kostar eit hjarte!</p>
    <div class="legend"><span>◀ ▶ / A D: flytt</span><span>P: pause</span><span>Mobil: dra eller bruk knappane</span></div>
    ${best?`<p class="gold">Rekord: ${best} poeng</p>`:""}
    <div class="row"><button class="btn go" data-act="start" data-focus>Start spelet</button></div>
    <p class="dim" style="margin-top:14px">Eller vel brett:</p>
    <div class="levels">${LEVELS.map((L,i)=>`<button class="btn" data-act="pick" data-l="${i}">${i+1}. ${esc(L.name)}</button>`).join("")}</div>
    <p class="dim" style="margin-top:14px">Laga av Silja Nordvik</p>`);
}

function introScreen(){
  state="intro"; words=[]; particles=[]; caught=0; px=W/2-PW/2; spawnT=.6;
  const L = LEVELS[lvl];
  show(`
    <h2>BRETT ${lvl+1}<br>${esc(L.name.toUpperCase())}</h2>
    <p>${esc(L.hint)}</p>
    <p>Fang <span class="gold">${GOAL} nynorskord</span> for å klare brettet.</p>
    <div class="row"><button class="btn go" data-act="play" data-focus>Klar!</button></div>`);
  say();
}

function levelClear(){
  state="clear"; sfx.win(); words=[];
  const L = LEVELS[lvl], last = lvl===LEVELS.length-1;
  show(`
    <h2>BRETT KLART!</h2>
    <p>Poeng: <span class="gold">${score}</span></p>
    <div class="tip"><b>HUGS: ${esc(L.name.toUpperCase())}</b>${esc(L.tip)}</div>
    <div class="row"><button class="btn go" data-act="${last?"win":"next"}" data-focus>${last?"Sjå resultatet":"Neste brett"}</button></div>`);
}

function reviewHtml(){
  if(!mistakes.size) return `<p class="ok">Ingen feil – imponerande!</p>`;
  return `<p>Ord å øve på:</p><div class="review">${[...mistakes].map(([bm,nn])=>
    `<div><span class="bad">${esc(bm)}</span> → <span class="ok">${esc(nn)}</span></div>`).join("")}</div>`;
}

function saveBest(){ const b=getBest(); if(score>b){ setBest(score); return true; } return false; }

function gameOver(){
  state="over"; sfx.over(); words=[];
  const rec = saveBest();
  show(`
    <h2>GAME OVER</h2>
    <p>Du kom til brett ${lvl+1} og fekk <span class="gold">${score}</span> poeng.${rec?' <span class="gold">Ny rekord!</span>':""}</p>
    ${reviewHtml()}
    <div class="row">
      <button class="btn go" data-act="retry" data-focus>Prøv brettet igjen</button>
      <button class="btn" data-act="menu">Meny</button>
    </div>`);
}

function winScreen(){
  state="win"; sfx.win();
  const rec = saveBest();
  show(`
    <h2>DU KLARTE ALT!</h2>
    <p>Alle ${LEVELS.length} brett er fullførte. Sluttsum: <span class="gold">${score}</span> poeng.${rec?' <span class="gold">Ny rekord!</span>':""}</p>
    ${reviewHtml()}
    <div class="row"><button class="btn go" data-act="restart" data-focus>Spel igjen</button><button class="btn" data-act="menu">Meny</button></div>`);
}

function pause(){
  if(state==="play"){ state="paused"; show(`<h2>PAUSE</h2><div class="row"><button class="btn go" data-act="resume" data-focus>Hald fram</button><button class="btn" data-act="menu">Meny</button></div>`); }
  else if(state==="paused"){ state="play"; hide(); }
}

ovCard.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="start"||a==="restart"){ lvl=0; score=0; lives=LIVES; mistakes.clear(); sfx.start(); introScreen(); }
  else if(a==="pick"){ lvl=+b.dataset.l; score=0; lives=LIVES; mistakes.clear(); sfx.start(); introScreen(); }
  else if(a==="play"){ hide(); state="play"; sfx.start(); say("Fang nynorskorda!"); }
  else if(a==="next"){ lvl++; lives = Math.min(LIVES, lives+1); introScreen(); }
  else if(a==="retry"){ lives=LIVES; introScreen(); }
  else if(a==="win"){ winScreen(); }
  else if(a==="resume"){ pause(); }
  else if(a==="menu"){ say(); titleScreen(); }
});

// ---------- Kontrollar ----------
addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  if(k==="arrowleft"||k==="a"){ keys.left=true; targetX=null; e.preventDefault(); }
  if(k==="arrowright"||k==="d"){ keys.right=true; targetX=null; e.preventDefault(); }
  if(k==="p"||k==="escape"){ pause(); }
});
addEventListener("keyup", e=>{
  const k = e.key.toLowerCase();
  if(k==="arrowleft"||k==="a") keys.left=false;
  if(k==="arrowright"||k==="d") keys.right=false;
});
const stage = document.getElementById("stage");
function toGameX(clientX){ const r = cv.getBoundingClientRect(); return (clientX - r.left) / r.width * W; }
let dragging=false;
cv.addEventListener("pointerdown", e=>{ dragging=true; targetX = toGameX(e.clientX); });
addEventListener("pointermove", e=>{ if(dragging) targetX = toGameX(e.clientX); });
addEventListener("pointerup", ()=>{ dragging=false; targetX=null; });
function hold(btn, key){
  const on = e=>{ e.preventDefault(); keys[key]=true; targetX=null; };
  const off = ()=>{ keys[key]=false; };
  btn.addEventListener("pointerdown", on); btn.addEventListener("pointerup", off);
  btn.addEventListener("pointerleave", off); btn.addEventListener("pointercancel", off);
}
hold(document.getElementById("leftBtn"),"left");
hold(document.getElementById("rightBtn"),"right");
document.getElementById("pauseBtn").addEventListener("click", pause);
const soundBtn = document.getElementById("soundBtn");
soundBtn.addEventListener("click", ()=>{ soundOn=!soundOn; soundBtn.textContent = "Lyd: " + (soundOn?"på":"av"); if(soundOn) beep(660,.05); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && state==="play") pause(); });

// ---------- Løkke ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  update(dt); render(dt);
  requestAnimationFrame(loop);
}
const ready = (document.fonts && document.fonts.load) ? document.fonts.load(FONT).catch(()=>{}) : Promise.resolve();
Promise.race([ready, new Promise(r=>setTimeout(r,1500))]).then(()=>{ titleScreen(); requestAnimationFrame(loop); });
})();
</script>
</body>
