<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nynorsk – Norsk vg3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fjord: #1f6f78;      /* turkis vann */
    --fjord-dyp: #134a52;
    --fjell: #2c3a47;      /* mørk fjellgrå */
    --mose: #5a7d3a;       /* grønt gress */
    --hytte: #9e2b25;      /* rød hytte */
    --sno: #f7f9f8;        /* snøhvit bakgrunn */
    --kort: #ffffff;
    --tekst: #22303a;
    --dempet: #5d6b75;
    --linje: #dde5e4;
    --skygge: 0 2px 6px rgba(20, 50, 60, .06), 0 8px 24px rgba(20, 50, 60, .08);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Source Sans 3", system-ui, sans-serif;
    font-size: 1.08rem;
    line-height: 1.6;
    color: var(--tekst);
    background: var(--sno);
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; line-height: 1.2; margin: 0; }
  a { color: var(--fjord); }

  /* ---------- Menylinje ---------- */
  .meny {
    position: sticky; top: 0; z-index: 10;
    background: var(--fjell);
    color: #fff;
  }
  .meny-indre {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: .75rem 1.25rem;
  }
  .logo {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700; font-size: 1.25rem;
    color: #fff; text-decoration: none;
  }
  .logo span { color: #8fd3d6; }
  .meny ul { list-style: none; display: flex; gap: .25rem; margin: 0; padding: 0; }
  .meny ul a {
    display: block; padding: .45rem .9rem; border-radius: 6px;
    color: #e8eef0; text-decoration: none; font-weight: 600;
  }
  .meny ul a:hover, .meny ul a:focus-visible { background: rgba(255,255,255,.12); color: #fff; }
  .meny-knapp {
    display: none; background: none; border: 1px solid rgba(255,255,255,.4);
    color: #fff; border-radius: 6px; padding: .35rem .7rem; font-size: 1rem; cursor: pointer;
  }

  /* ---------- Toppbilde ---------- */
  .topp {
    background: linear-gradient(135deg, var(--fjord-dyp) 0%, var(--fjord) 100%);
    color: #fff;
  }
  .topp-indre {
    max-width: 1100px; margin: 0 auto;
    padding: 3rem 1.25rem;
    display: grid; grid-template-columns: 1fr minmax(0, 512px);
    gap: 2.5rem; align-items: center;
  }
  .topp h1 { font-size: clamp(2rem, 4.5vw, 3rem); }
  .topp p { font-size: 1.2rem; max-width: 36ch; margin: .8rem 0 0; color: #e3f2f2; }
  .topp img {
    display: block; width: 100%; height: auto;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }

  /* ---------- Innhold ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 0 1.25rem; }
  section { padding: 3rem 0 1rem; scroll-margin-top: 4rem; }
  .seksjon-tittel { font-size: 1.8rem; color: var(--fjell); }
  .seksjon-ingress { color: var(--dempet); margin: .35rem 0 1.5rem; }

  /* Kort */
  .kortrutenett {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1.25rem;
  }
  .kort {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--kort);
    border: 1px solid var(--linje);
    border-top: 5px solid var(--farge, var(--fjord));
    border-radius: 12px;
    padding: 1.3rem 1.3rem 1.1rem;
    text-decoration: none; color: inherit;
    box-shadow: var(--skygge);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.kort:hover, a.kort:focus-visible { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(20,50,60,.1), 0 14px 32px rgba(20,50,60,.14); }
  .kort-ikon {
    width: 3rem; height: 3rem; border-radius: 10px;
    display: grid; place-items: center; font-size: 1.6rem;
    background: color-mix(in srgb, var(--farge, var(--fjord)) 14%, white);
    margin-bottom: .8rem;
  }
  .kort h3 { font-size: 1.3rem; color: var(--fjell); }
  .kort p { margin: .35rem 0 .9rem; color: var(--dempet); font-size: 1rem; flex: 1; }
  .kort-lenke { font-weight: 700; color: var(--farge, var(--fjord)); }
  .kort.snart { opacity: .75; }
  .kort .merke, .kort-lenke { align-self: flex-start; }
  .merke {
    display: inline-block; font-size: .8rem; font-weight: 700;
    padding: .1rem .55rem; border-radius: 99px;
    background: #eef1f1; color: var(--dempet);
  }

  /* Ressurslister */
  .lenkeliste { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
  .lenkeliste a {
    display: block; background: var(--kort); border: 1px solid var(--linje);
    border-radius: 10px; padding: 1rem 1.2rem; text-decoration: none; color: inherit;
  }
  .lenkeliste a:hover { border-color: var(--fjord); }
  .lenkeliste strong { color: var(--fjord-dyp); }
  .lenkeliste span { display: block; color: var(--dempet); font-size: .95rem; }

  .plassholder {
    background: var(--kort); border: 2px dashed var(--linje); border-radius: 12px;
    padding: 1.5rem; color: var(--dempet); text-align: center;
  }

  /* Oppdateringer */
  .oppdateringer {
    background: var(--kort);
    border: 1px solid var(--linje);
    border-left: 6px solid var(--hytte);
    border-radius: 12px;
    padding: 1.5rem 1.6rem;
    box-shadow: var(--skygge);
  }
  .oppdateringer h2 { font-size: 1.5rem; color: var(--fjell); display: flex; align-items: center; gap: .5rem; }
  .oppdateringer ul { list-style: none; margin: 1rem 0 0; padding: 0; }
  .oppdateringer li { display: flex; gap: 1rem; padding: .7rem 0; border-top: 1px solid var(--linje); }
  .oppdateringer li:first-child { border-top: none; }
  .dato { flex: 0 0 6.5rem; font-weight: 700; color: var(--hytte); font-size: .95rem; padding-top: .1rem; }
  .ny { margin-left: .4rem; background: var(--hytte); color: #fff; }

  .om { max-width: 65ch; }

  /* ---------- Bunntekst ---------- */
  footer {
    margin-top: 3.5rem;
    background: var(--fjell); color: #d6dfe2;
    text-align: center; padding: 2rem 1.25rem;
  }
  footer .linje1 { font-family: "Fraunces", Georgia, serif; font-size: 1.15rem; color: #fff; }
  footer .linje2 { margin-top: .3rem; font-size: .95rem; letter-spacing: .02em; }
  footer .prikk { color: #8fd3d6; margin: 0 .5rem; }

  /* ---------- Mobil ---------- */
  @media (max-width: 720px) {
    .topp-indre { grid-template-columns: 1fr; gap: 1.5rem; padding: 2rem 1.25rem; }
    .oppdateringer li { flex-direction: column; gap: .1rem; }
    .dato { flex: none; }
  }

  .topp-liten { background: linear-gradient(135deg, var(--fjord-dyp) 0%, var(--fjord) 100%); color:#fff; }
  .topp-liten .indre { max-width:1100px; margin:0 auto; padding:2.2rem 1.25rem 2.4rem; }
  .tilbake { display:inline-block; color:#cdeeee; text-decoration:none; font-weight:600; margin-bottom:.8rem; }
  .tilbake:hover { color:#fff; text-decoration:underline; }
  .topp-liten h1 { font-size: clamp(2rem,4.5vw,2.8rem); }
  .topp-liten p { color:#e3f2f2; font-size:1.15rem; margin:.5rem 0 0; max-width:55ch; }
  .meta { font-size:.9rem; font-weight:600; color: var(--farge, var(--fjord)); margin-top:.15rem; }
  .kort .merke { margin-top:.6rem; }
  .rekkefolge { counter-reset: n; }
  .rekkefolge .kort::before { counter-increment:n; content: counter(n); position:absolute; top:1rem; right:1.1rem;
     width:1.8rem; height:1.8rem; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:.95rem;
     background: color-mix(in srgb, var(--farge) 14%, white); color: var(--farge); }
  .avslutning { margin-top:1.25rem; }
  .avslutning .kort { border-top-width:5px; background: linear-gradient(180deg, #fbfdf8, #fff); }

  main { min-height: 55vh; }
  .tom { background: var(--kort); border: 2px dashed var(--linje); border-radius: 12px; padding: 1.3rem; color: var(--dempet); text-align: center; }
</style>
</head>
<body>

<nav class="meny" aria-label="Hovedmeny">
  <div class="meny-indre">
    <a class="logo" href="../">Norsk <span>vg3</span></a>
    <ul>
      <li><a href="../#om">Om</a></li>
    </ul>
  </div>
</nav>

<header class="topp-liten">
  <div class="indre">
    <a class="tilbake" href="../">← Tilbake til forsiden</a>
    <h1>🏔️ Nynorsk</h1>
    <p>Grammatikk, ordtilfang og skriveøving på nynorsk.</p>
  </div>
</header>

<main id="innhold"></main>

<footer>
  <div class="linje1">Laget for norsk vg3</div>
  <div class="linje2">
    Silja Nordvik<span class="prikk">•</span><span id="aar">2026</span><span class="prikk">•</span>Faglig forankret kunnskap
  </div>
</footer>

<script>
  /* =========================================================
     LENKER PÅ NYNORSK-SIDEN
     Legg til en ny lenke ved å kopiere en linje og endre den.
     type: "kahoot", "video", "spill", "oppgave" eller "lenke"
     ========================================================= */
  const lenker = [
    { type: "kahoot", tittel: "Kahoot: Nynorsk", tekst: "Test deg selv i nynorsk.", lenke: "https://play.kahoot.it/v2/?quizId=9c8010d9-6c6b-4c38-a816-1a0699a34fb6" }
  ];

  /* ----- Det under trenger du ikke endre ----- */
  const typer = {
    kahoot:  { overskrift: "Kahoot",    ikon: "🎯", farge: "#46178f", knapp: "Åpne Kahoot ↗" },
    video:   { overskrift: "Videoer",   ikon: "🎬", farge: "#c4302b", knapp: "Se videoen ↗" },
    spill:   { overskrift: "Spill",     ikon: "🎲", farge: "#7a4e8c", knapp: "Start spillet →" },
    oppgave: { overskrift: "Oppgaver",  ikon: "✏️", farge: "#5a7d3a", knapp: "Åpne oppgaven →" },
    lenke:   { overskrift: "Andre lenker", ikon: "🔗", farge: "#1f6f78", knapp: "Åpne lenken ↗" }
  };
  const main = document.getElementById("innhold");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let noe = false;
  Object.entries(typer).forEach(([type, t]) => {
    const liste = lenker.filter(l => l.type === type);
    if (!liste.length) return;
    noe = true;
    const sek = document.createElement("section");
    sek.innerHTML = `<h2 class="seksjon-tittel">${t.overskrift}</h2><div class="kortrutenett" style="margin-top:1.2rem"></div>`;
    const rut = sek.querySelector(".kortrutenett");
    liste.forEach(l => {
      const ekstern = /^https?:/.test(l.lenke);
      const a = document.createElement("a");
      a.className = "kort"; a.href = l.lenke;
      if (ekstern) { a.target = "_blank"; a.rel = "noopener"; }
      a.style.setProperty("--farge", t.farge);
      a.innerHTML = `<div class="kort-ikon" aria-hidden="true">${t.ikon}</div><h3>${esc(l.tittel)}</h3><p>${esc(l.tekst || "")}</p><span class="kort-lenke">${t.knapp}</span>`;
      rut.appendChild(a);
    });
    main.appendChild(sek);
  });
  if (!noe) main.innerHTML = '<section><div class="tom">Det kommer innhold her snart.</div></section>';
  document.getElementById("aar").textContent = new Date().getFullYear();
</script>
</body>
</html>
